# Root-level pytest config.
#
# pytest discovers config from the common ancestor of its args. CI runs
# `uv run pytest ../tests/unit -q` from backend/, so backend/pyproject.toml's
# [tool.pytest.ini_options] is never seen (rootdir resolves to the repo
# root). This file makes async support and imports work for bare invocations.
# backend/pyproject.toml mirrors these options for `-c pyproject.toml` runs.
#
# Note: pytest.ini takes precedence over pyproject.toml when both are found;
# this only affects invocations whose rootdir is the repo root.

[pytest]
testpaths = tests
pythonpath = backend
asyncio_mode = auto
addopts = -q --strict-markers
