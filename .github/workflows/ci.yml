name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint, typecheck, unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.x"
      - name: Install dependencies
        run: uv sync
      - name: Lint (ruff)
        run: uv run ruff check app ../tests
      - name: Typecheck (mypy)
        run: uv run mypy app
      - name: Unit + contract tests
        run: uv run pytest -c pyproject.toml ../tests/unit ../tests/contract -q

  backend-integration:
    name: Backend (integration, pgvector)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: pramya
          POSTGRES_PASSWORD: pramya
          POSTGRES_DB: pramya
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pramya"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.x"
      - name: Install dependencies
        run: uv sync
      - name: Integration tests
        run: uv run pytest -c pyproject.toml ../tests/integration -q
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://pramya:pramya@localhost:5432/pramya_test

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint (oxlint)
        run: pnpm lint
      - name: Typecheck + build
        run: pnpm build
