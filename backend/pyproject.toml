[project]
name = "pramya-backend"
version = "0.1.0"
description = "Pramya — evidence-driven interview preparation. Backend."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.139,<0.140",
    "uvicorn[standard]>=0.35",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.10",
    "python-multipart>=0.0.20",
    "httpx>=0.28",
    "sqlalchemy[asyncio]>=2.0.51,<2.1",
    "asyncpg>=0.30",
    "alembic>=1.16",
    "pgvector>=0.5,<0.6",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "markdown-it-py>=3.0",
    "langchain-core>=1.5,<1.6",
    "langgraph>=1.2,<1.3",
    "langgraph-checkpoint-postgres>=3.1,<4",
    "psycopg[binary]>=3.2",
    "llama-index-core>=0.14,<0.15",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "pytest-cov>=6",
    "ruff>=0.14",
    "mypy>=1.17",
    "pyright>=1.1.400",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = [".", "../"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]  # assertions fine in tests

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["tests/", "alembic/"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["app"]
exclude = ["tests/**", "alembic/**"]
